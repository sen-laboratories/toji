name: "haiku-ci"
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write   # to attach the package to a release

jobs:
  # every file has its license (REUSE), and the MIT components in lib/ need nothing that is copyleft
  licenses:
    runs-on: ubuntu-latest
    name: licenses
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
      - name: lib/ is MIT and stays independent
        run: tests/check_lib_boundary.sh

  # the user guide is made from the Markdown chapters in docs/guide: HTML, EPUB 3, PDF and DjVu
  docs:
    runs-on: ubuntu-latest
    name: user-guide
    steps:
      - uses: actions/checkout@v7
      - uses: pandoc/actions/setup@v1
        with:
          version: 3.10.2
      - uses: typst-community/setup-typst@v5
      - name: Install pdf2djvu
        run: sudo apt-get update && sudo apt-get install -y pdf2djvu
      - name: Build the guide
        run: docs/guide/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: toji-user-guide
          path: docs/guide/build/
          if-no-files-found: error

  build-haiku:
    timeout-minutes: 120
    needs: docs
    runs-on: ubuntu-latest
    name: build-haiku-r1beta6-x86-64

    steps:
      - uses: actions/checkout@v7

      # the guide goes into the package
      - uses: actions/download-artifact@v7
        with:
          name: toji-user-guide
          path: docs/guide/build

      - name: Start Haiku VM
        uses: cross-platform-actions/action@v1.6.0
        with:
          operating_system: haiku
          architecture: x86-64
          version: 'r1beta6'

      # the steps below run inside the VM, files are synced both ways
      # MuPDF is not in HaikuPorts in a version we can use, it comes from our own package repository (see
      # MUPDF-NOTES.md)
      - name: Install build dependencies
        shell: cpa.sh {0}
        run: |
          # fetching the repository fails now and then ("Failed to open repository file"), so it is tried again
          for attempt in 1 2 3 4; do
            pkgman add-repo https://kiri.sen-labs.org/x86_64 || true
            if pkgman install -y mupdf1.28_devel libarchive_devel djvu_devel libzip_devel libxml2_devel freetype_devel cmd:gcc gcc_syslibs_devel cmd:make cmd:pkg_config; then
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep 10
          done
          exit 1

      - name: Build and package
        shell: cpa.sh {0}
        run: ./build.sh && ./package.sh

      # the package is back in the workspace now
      - uses: actions/upload-artifact@v7
        with:
          name: toji-haiku-r1beta6-x86-64
          path: "*.hpkg"
          if-no-files-found: error

      # pushing a tag like v0.1.0 publishes the package as a release
      - uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            *.hpkg
            docs/guide/build/toji-guide.*
          generate_release_notes: true
